name = "retrac-api"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
PAYPAL_MODE = "sandbox"
PRICE       = "3.00"
CURRENCY    = "USD"
BRAND_NAME  = "Odium"
SITE_URL    = "https://getodium.shop"
BUILD       = "v1.0.0"
MAIL_TO     = "n4tey4130@gmail.com"
MAIL_FROM   = "Odium <orders@getodium.shop>"
MAIL_REPLY_TO = "n4tey4130@gmail.com"
MAIL_BUYER  = "true"
CORS_ORIGIN = "https://getodium.shop,https://www.getodium.shop,https://odium.shop,https://www.odium.shop,https://*.pages.dev,http://localhost:8123,http://127.0.0.1:8123"

# Secrets (set with `wrangler secret put NAME`):
#   HWID_SALT, WH_SECRET, RESEND_KEY, DISCORD_BOT_TOKEN, ADMIN_SECRET
#   PAYPAL_SANDBOX_CLIENT_ID, PAYPAL_SANDBOX_SECRET
#   PAYPAL_LIVE_CLIENT_ID, PAYPAL_LIVE_SECRET

# Licensing D1 — has orders + licenses + sessions + builds tables
[[d1_databases]]
binding       = "DB"
database_name = "licdb"
database_id   = "9429980a-51fa-4c49-85a7-75c3f212d260"

# R2 bucket for encrypted cheat binaries
[[r2_buckets]]
binding     = "R2"
bucket_name = "payloads"

[observability]
enabled = true
