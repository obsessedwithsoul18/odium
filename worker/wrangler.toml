name = "odium-api"
main = "src/index.js"
compatibility_date = "2025-06-01"


[vars]
PAYPAL_MODE = "sandbox"
PRICE       = "3.00"
CURRENCY    = "USD"
BRAND_NAME  = "Odium"
SITE_URL    = "https://getodium.shop"
MAIL_FROM   = "keys@getodium.shop"
MAIL_TO     = "natevisionn@gmail.com"
BUILD       = "v1.0.0"

CORS_ORIGIN = "https://getodium.shop,https://www.getodium.shop,http://localhost:8123"

[[d1_databases]]
binding     = "DB"
database_name = "licdb"
database_id = "REPLACE_WITH_YOUR_D1_ID"

[[r2_buckets]]
binding     = "R2"
bucket_name = "payloads"

[observability]
enabled = true
